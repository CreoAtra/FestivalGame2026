<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>フルーツキャッチゲーム</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="screens.css">

  <!-- ライブラリ(CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
</head>
<body>

  <div id="game-container">
    <!-- p5.js が作る Canvas がここに入ります -->
    <div id="canvas-wrapper"></div>

    <!-- 操作ボタン(UI担当) -->
    <div id="controls">
      <div id="move-buttons">
        <button id="btn-left" class="control-btn">←</button>
        <button id="btn-right" class="control-btn">→</button>
      </div>
      <button id="btn-jump" class="control-btn">JUMP</button>
    </div>

    <!-- タイトル画面・結果画面(タイトル・結果・ランキング担当) -->
    <div id="screen-title" class="screen">
      <h1>フルーツキャッチ</h1>
      <p>ハイスコア: <span id="screen-title-best">0</span></p>
      <button id="screen-btn-start" class="screen-btn">スタート</button>
      <p class="screen-help">← → で移動 / JUMP でジャンプ</p>
    </div>

    <div id="screen-result" class="screen">
      <h2>結果</h2>
      <p>スコア: <span id="screen-result-score">0</span></p>
      <p id="screen-result-best" class="is-hidden">自己ベスト更新!</p>
      <p>ランキング</p>
      <ol id="screen-result-ranking"></ol>
      <button id="screen-btn-retry" class="screen-btn">もう一度</button>
      <button id="screen-btn-title" class="screen-btn">タイトルへ</button>
    </div>
  </div>

  <!--
    各担当のファイル。
    main.js は他のファイルの関数を呼び出すので、必ず最後に読み込みます。
    ファイルを追加したときは、ここに <script> タグを足してください。
  -->
  <script src="character.js"></script>
  <script src="fruit.js"></script>
  <script src="collision.js"></script>
  <script src="ui.js"></script>
  <script src="assets.js"></script>
  <script src="extra.js"></script>
  <script src="screens.js"></script>
  <script src="main.js"></script>

</body>
</html>
